name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: 可选 QUIC 输入实验
        run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask lint

  settings-ui:
    name: settings ui (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  windows-bundle:
    # 在 Windows 上打出安装包（后台 + 设置界面，ADR 0011），作为构建产物上传：
    # 在 Actions 的运行页面下载，解压后双击安装。
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链
        run: rustup show active-toolchain || rustup toolchain install
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      # 运行器自带的是 Inno Setup 6，没有简体中文；装官方发布的 7.1.1，并核对校验和。
      - name: 安装 Inno Setup 7.1.1
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw "Inno Setup 安装程序的校验和不对：$hash" }
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait
          "ISCC=$(Join-Path $dir 'ISCC.exe')" >> $env:GITHUB_ENV
      - run: cargo xtask bundle
      - name: 取提交号的前 7 位
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenFerry-windows-setup-${{ steps.commit.outputs.short }}
          path: target/bundle/windows/*-setup.exe
          retention-days: 14
          if-no-files-found: error

  macos-bundle:
    # 普通 CI 的开发包：通用架构、临时签名，无需 Apple 证书或公证密钥。
    name: macOS 通用开发包
    runs-on: macos-latest
    env:
      SCREENFERRY_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链与两个 macOS 目标
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
      - name: 使用通用 Flutter 构建并确认 Xcode
        run: |
          flutter config --no-enable-macos-arm64-only
          xcodebuild -version
      - name: 安装 dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.5
          echo "SCREENFERRY_DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: 打包通用应用与安装盘（临时签名）
        run: cargo xtask bundle --universal --dmg
      - name: 验证后台与设置界面的通用架构
        run: |
          bundle="target/bundle/macos/ScreenFerry.app/Contents"
          helper="$bundle/Helpers/ScreenFerry.app/Contents"
          for binary in "$bundle/MacOS/screenferry" "$helper/MacOS/ScreenFerry" "$helper/Frameworks/App.framework/App" "$helper/Frameworks/FlutterMacOS.framework/FlutterMacOS"; do
            lipo "$binary" -archs
            lipo "$binary" -verify_arch arm64 x86_64
          done
      - name: 取提交号的前 7 位
        id: commit
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenFerry-macos-universal-dev-${{ steps.commit.outputs.short }}
          path: |
            target/bundle/macos/*-macos-universal.zip
            target/bundle/macos/*-macos-universal.dmg
          retention-days: 14
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
