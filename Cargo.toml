[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# ── 内部 crate ──────────────────────────────
ferry-types = { path = "crates/ferry-types" }
ferry-proto = { path = "crates/ferry-proto" }
ferry-core = { path = "crates/ferry-core" }
ferry-trust = { path = "crates/ferry-trust" }
ferry-platform = { path = "crates/ferry-platform" }
ferry-platform-windows = { path = "crates/ferry-platform-windows" }
ferry-platform-macos = { path = "crates/ferry-platform-macos" }
ferry-platform-mock = { path = "crates/ferry-platform-mock" }
ferry-net = { path = "crates/ferry-net" }
ferry-store = { path = "crates/ferry-store" }
ferry-ipc = { path = "crates/ferry-ipc" }
ferry-engine = { path = "crates/ferry-engine" }
ferry-update = { path = "crates/ferry-update" }

# ── 第三方 ──────────────────────────────────
bitflags = "2"
embed-resource = "3.0.12"
if-addrs = "0.15"
libc = "0.2.191"
mdns-sd = { version = "0.21.6", default-features = false }
minisign = { version = "0.10.0", default-features = false }
minisign-verify = "0.3.0"
png = "0.18.1"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
thiserror = "2"
time = "0.3.55"
tokio = { version = "1.54", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std"] }
tray-icon = { version = "0.26.1", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

# ── 平台 ────────────────────────────────────
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSColor",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSPanel",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStringDrawing",
    "NSText",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFMachPort",
    "CFRunLoop",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDirectDisplay",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
    "CGRemoteOperation",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# 实现 COM 接口（拖放目标）的宏展开后直接引用这两个 crate。
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
