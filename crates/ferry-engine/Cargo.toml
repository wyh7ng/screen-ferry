[package]
name = "ferry-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
test = false

[features]
default = []
quic-experiment = ["ferry-net/quic-experiment"]

[dependencies]

ferry-core.workspace = true
ferry-ipc.workspace = true
ferry-net.workspace = true
ferry-platform.workspace = true
ferry-proto.workspace = true
ferry-store.workspace = true
ferry-trust.workspace = true
ferry-types.workspace = true
ferry-update.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ferry-platform-mock.workspace = true
minisign.workspace = true

[lints]
workspace = true

[[bench]]
name = "input_pipeline"
harness = false
